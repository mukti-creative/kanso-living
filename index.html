<!--
  Static markup below is the page skeleton. Text/images/lists are filled from
  CLIENT_CONFIG by app.js:

    data-img="path"  / data-alt="path" → <img src / alt>

-->
<body class="bg-surface text-on-surface font-body antialiased">
  <a href="#main" data-text="ui.skipToContent" class="sr-only focus:not-sr-only focus:fixed focus:top-md focus:left-md focus:z-50 focus:bg-charcoal focus:text-on-charcoal focus:px-md focus:py-sm focus:rounded-md"></a>

            </span>

    <main id="main" class="flex-1">

          <circle cx="1180" cy="240" r="340" stroke="currentColor" stroke-width="1.5"></circle>
          <circle cx="1180" cy="240" r="480" stroke="currentColor" stroke-width="1"></circle>
          <path d="M-80 620 C 320 420, 760 680, 1480 340" stroke="currentColor" stroke-width="1.5"></path>
        </svg>

        <div class="relative z-10 max-w-7xl mx-auto px-lg grid grid-cols-1 lg:grid-cols-12 gap-xl items-center">
          <div class="lg:col-span-6 flex flex-col gap-lg">

                  <span class="relative inline-flex w-sm h-sm rounded-full bg-charcoal"></span>

            </div>
            <h1 class="font-display text-display-lg-mobile lg:text-display-lg text-on-surface text-balance" data-text="hero.title"></h1>
            <p class="font-body text-body-lg text-on-surface-muted text-pretty max-w-prose" data-text="hero.subtitle"></p>

            <div class="flex flex-wrap items-center gap-md pt-sm">
              <a data-href="hero.primaryCta.href" class="inline-flex items-center justify-center gap-sm rounded-full bg-electric-blue text-on-electric-blue px-xl py-md font-label text-label-lg transition-transform duration-state-change ease-state-change hover:-translate-y-0.5 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-electric-blue">
                <span data-text="hero.primaryCta.label"></span>
                <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_forward</span>
              </a>
              <a data-href="hero.secondaryCta.href" class="inline-flex items-center justify-center rounded-full bg-surface text-on-surface border border-outline px-xl py-md font-label text-label-lg transition-colors duration-state-change ease-state-change hover:bg-surface-subtle focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-electric-blue">
                <span data-text="hero.secondaryCta.label"></span>
              </a>
            </div>

            <div class="grid grid-cols-3 gap-lg pt-lg border-t border-outline max-w-lg" data-render="hero-metrics"></div>
          </div>

          <div class="lg:col-span-6">
            <div class="relative rounded-xl overflow-hidden bg-electric-blue p-sm">

                <img id="hero-img" data-img="images.hero" data-alt="hero.imageAlt" alt="" fetchpriority="high" class="w-full h-96 lg:h-[480px] object-cover">
                <!-- Duotone tint layers: shown only when hero.imageStyle = 'duotone' -->
                <div data-hero-tint class="hidden absolute inset-0 bg-electric-blue mix-blend-multiply opacity-75"></div>
                <div data-hero-tint class="hidden absolute inset-0 bg-electric-blue mix-blend-screen opacity-20"></div>
                <!-- Soft gradient keeps the white chips readable on natural photos -->
                <div data-hero-natural class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/25"></div>
                <div class="absolute top-lg left-lg flex flex-wrap gap-sm" data-render="hero-badges"></div>
                <div class="absolute bottom-lg left-lg right-lg flex items-center justify-between gap-md" data-render="hero-location"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

        </div>
      </section>

      <!-- 5. Facilities -->
      <section id="facilities" class="bg-surface-subtle py-2xl lg:py-section">
        <div class="max-w-7xl mx-auto px-lg grid grid-cols-1 lg:grid-cols-12 gap-lg items-stretch">
          <div class="lg:col-span-5 rounded-xl bg-sunlit-yellow text-on-sunlit-yellow p-xl lg:p-2xl flex flex-col justify-between gap-xl">

      <section id="kpr-simulation" class="bg-surface py-2xl lg:py-section">

          <div class="lg:col-span-7 rounded-xl bg-surface-subtle border border-outline p-xl lg:p-2xl flex flex-col gap-xl">

              <h2 class="font-headline text-headline-md text-on-surface" data-text="kpr.title"></h2>

                </div>
              </div>
              <div class="flex flex-col gap-sm">

          <div class="lg:col-span-5 flex flex-col gap-lg">
            <div class="rounded-xl bg-surface-subtle border border-outline p-xl flex flex-col gap-md">
              <span class="font-label text-label-sm text-on-surface-muted" data-text="kpr.bankTitle"></span>
              <div class="grid grid-cols-3 gap-sm" data-render="banks"></div>
            </div>
            <div class="flex flex-col gap-lg" data-render="testimonials"></div>
          </div>
        </div>
      </section>

      <!-- 7. CTA -->
      <section id="consultation" class="bg-surface pb-2xl lg:pb-section">
        <div class="max-w-7xl mx-auto px-lg">
          <div class="rounded-xl bg-electric-blue text-on-electric-blue p-xl lg:p-3xl flex flex-col md:flex-row md:items-center justify-between gap-xl">
            <div class="flex flex-col gap-sm max-w-xl">
              <h2 class="font-headline text-headline-lg-mobile lg:text-headline-lg text-balance" data-text="consultation.title"></h2>
              <p class="font-body text-body-lg text-pretty" data-text="consultation.text"></p>
            </div>
            <a data-wa="general" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-sm rounded-full bg-sunlit-yellow text-on-sunlit-yellow px-xl py-md font-label text-label-lg whitespace-nowrap self-start md:self-center transition-transform duration-state-change ease-state-change hover:-translate-y-0.5 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface">
              <span class="material-symbols-outlined text-title-md" aria-hidden="true">chat</span>
              <span data-text="consultation.buttonLabel"></span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-charcoal text-on-charcoal py-2xl">
      <div class="max-w-7xl mx-auto px-lg flex flex-col gap-xl">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-xl">
          <div class="md:col-span-5 flex flex-col gap-md">
            <div class="flex items-center gap-sm">
              <span class="inline-flex items-center justify-center w-xl h-xl rounded-md bg-electric-blue text-on-electric-blue">
                <span class="material-symbols-outlined text-title-md" aria-hidden="true" data-text="brand.logoIcon"></span>
              </span>
              <span class="font-title text-title-md text-on-charcoal" data-text="brand.name"></span>
            </div>
            <p class="font-body text-body-md text-charcoal-muted max-w-sm" data-text="footer.about"></p>
          </div>
          <div class="md:col-span-4 grid grid-cols-2 gap-xl" data-render="footer-columns"></div>
          <div class="md:col-span-3 flex flex-col gap-sm">
            <span class="font-label text-label-sm text-charcoal-muted" data-text="footer.galleryTitle"></span>
            <span class="font-body text-body-md text-on-charcoal" data-text="footer.address"></span>
            <span class="font-body text-body-md text-charcoal-muted" data-text="footer.hours"></span>
          </div>
        </div>
        <div class="pt-lg border-t border-charcoal-surface flex flex-col sm:flex-row items-center justify-between gap-md">
          <span class="font-label text-label-sm text-charcoal-muted" data-text="footer.copyright"></span>
          <span class="font-label text-label-sm text-charcoal-muted" data-text="footer.tagline"></span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Property detail modal (content injected by app.js) -->
  <div id="property-modal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-lg" data-open="false" aria-hidden="true">
    <div class="modal-backdrop absolute inset-0" data-close-modal></div>
    <div id="modal-panel" class="modal-panel relative w-full max-w-5xl max-h-[92vh] overflow-y-auto bg-surface rounded-t-xl sm:rounded-xl p-md sm:p-lg"
      role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button type="button" data-close-modal id="modal-close" class="absolute top-md right-md z-10 inline-flex items-center justify-center w-2xl h-2xl rounded-full bg-charcoal text-on-charcoal focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-electric-blue" aria-label="Tutup">
        <span class="material-symbols-outlined text-title-md" aria-hidden="true">close</span>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>
</body>
</html>
